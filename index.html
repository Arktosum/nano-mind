<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nano-Mind Visualizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <h1>Nano-Mind: Embedding Math</h1>
      <p>
        Type a word, then click a token to visualize the exact matrix
        multiplication that generates its vector.
      </p>
    </div>

    <div class="container">
      <input
        type="text"
        id="promptInput"
        placeholder="Type something..."
        autocomplete="off"
        disabled
      />
      <div id="statusBox" class="panel status">Loading weights.json...</div>

      <div id="pipelineBox" class="panel" style="display: none">
        <div class="section-header">
          <h3>Tokenization Sequence</h3>
          <button id="viewVocabBtn" class="btn-small">
            View Full Vocabulary Table
          </button>
        </div>
        <div id="tokensContainer" style="margin-bottom: 24px"></div>

        <h3
          style="
            border-top: 1px solid #333;
            padding-top: 24px;
            margin-top: 24px;
          "
        >
          The Embedding Matrix (W_token)
        </h3>
        <div id="embeddingContainer" class="vector-math">
          <span class="muted"
            >Select a token above to run the linear algebra.</span
          >
        </div>
      </div>
    </div>

    <div id="vocabModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Token Encoding Table</h3>
          <span class="close" id="closeModal">&times;</span>
        </div>
        <div id="vocabGrid" class="vocab-grid"></div>
      </div>
    </div>

    <script src="math.js"></script>
    <script src="engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
